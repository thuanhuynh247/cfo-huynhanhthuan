metrics:
- name: tran_bien_do
  description: 'Trần biên độ tỷ giá. Mức giá bán USD cao nhất ngân hàng được phép niêm yết: tỷ giá trung tâm × 1,05
    (biên độ ±5%). Đơn vị: đồng/USD.'
  expression:
    dialects:
    - dialect: DUCKDB
      expression: SELECT ngay, ty_gia * 1.05 AS tran_bien_do FROM ty_gia_trung_tam
- name: gia_ban_usd_trung_vi
  description: 'Giá bán USD trung vị của ngân hàng. Trung vị giá bán USD của các ngân hàng trong ngày; dùng trung
    vị để loại số lạ. Đơn vị: đồng/USD.'
  expression:
    dialects:
    - dialect: DUCKDB
      expression: SELECT ngay, MEDIAN(ban) AS gia_ban_trung_vi, COUNT(*) AS so_ngan_hang FROM gia_usd_ngan_hang
        GROUP BY ngay
- name: vi_tri_bien_do_pct
  description: 'Áp lực tỷ giá (vị trí trong biên độ trên). Giá bán USD trung vị đã dùng bao nhiêu phần khoảng từ
    tỷ giá trung tâm đến trần. 0% = bằng trung tâm, 100% = chạm trần. Đơn vị: %.'
  expression:
    dialects:
    - dialect: DUCKDB
      expression: "SELECT t.ngay, t.ty_gia, t.ty_gia * 1.05 AS tran, b.gia_ban_trung_vi,\n       (b.gia_ban_trung_vi\
        \ - t.ty_gia) / (t.ty_gia * 0.05) * 100 AS vi_tri_pct\nFROM ty_gia_trung_tam t\nJOIN (SELECT ngay, MEDIAN(ban)\
        \ AS gia_ban_trung_vi FROM gia_usd_ngan_hang GROUP BY ngay) b USING (ngay)"
- name: du_dia_den_tran_pct
  description: 'Dư địa giá bán USD đến trần. Giá bán USD trung vị còn cách trần bao nhiêu phần trăm. Đơn vị: %.'
  expression:
    dialects:
    - dialect: DUCKDB
      expression: 'SELECT t.ngay, (t.ty_gia * 1.05 - b.g) / b.g * 100 AS du_dia_pct FROM ty_gia_trung_tam t

        JOIN (SELECT ngay, MEDIAN(ban) AS g FROM gia_usd_ngan_hang GROUP BY ngay) b USING (ngay)'
- name: thay_doi_ty_gia_tu_dau_nam_pct
  description: 'Tỷ giá trung tâm thay đổi từ đầu năm. Tỷ giá trung tâm mới nhất so với phiên đầu tiên của năm. Đơn
    vị: %.'
  expression:
    dialects:
    - dialect: DUCKDB
      expression: 'WITH n AS (SELECT * FROM ty_gia_trung_tam WHERE year(ngay) = (SELECT year(max(ngay)) FROM ty_gia_trung_tam))

        SELECT (last(ty_gia ORDER BY ngay) / first(ty_gia ORDER BY ngay) - 1) * 100 AS thay_doi_pct FROM n'
- name: khoi_luong_omo_ngay
  description: 'Khối lượng OMO trúng thầu trong ngày. Tổng khối lượng trúng thầu của mọi lượt, mọi kỳ hạn trong
    ngày. Đơn vị: tỷ đồng.'
  expression:
    dialects:
    - dialect: DUCKDB
      expression: SELECT ngay, SUM(khoi_luong) AS khoi_luong FROM omo GROUP BY ngay
- name: lai_suat_omo
  description: 'Lãi suất OMO đại diện. Lãi suất trúng thầu của kỳ hạn ngắn nhất có khối lượng trong phiên gần nhất.
    Đơn vị: %/năm.'
  expression:
    dialects:
    - dialect: DUCKDB
      expression: 'SELECT ngay, arg_min(lai_suat, ky_han_ngay) AS lai_suat_omo FROM omo

        WHERE khoi_luong > 0 AND lai_suat > 0 GROUP BY ngay'
- name: chenh_qua_dem_omo
  description: 'Chênh lãi suất qua đêm so với OMO. Lãi suất qua đêm trừ lãi suất OMO đại diện. Dương rõ (> 0,5 điểm)
    = thanh khoản căng. Đơn vị: điểm %.'
  expression:
    dialects:
    - dialect: DUCKDB
      expression: 'WITH o AS (SELECT ngay, arg_min(lai_suat, ky_han_ngay) AS omo FROM omo WHERE khoi_luong > 0 GROUP
        BY ngay ORDER BY ngay DESC LIMIT 1)

        SELECT l.ngay, l.lai_suat - o.omo AS chenh FROM lai_suat_lien_ngan_hang l, o

        WHERE l.ky_han = ''ON'' ORDER BY l.ngay DESC LIMIT 1'
- name: lai_suat_thuc
  description: 'Lãi suất điều hành thực. Lãi suất OMO đại diện (hoặc tái cấp vốn nếu chưa có OMO) trừ CPI so với
    cùng kỳ tháng gần nhất. Âm = dư địa hạ lãi suất hẹp. Đơn vị: điểm %.'
  expression:
    dialects:
    - dialect: DUCKDB
      expression: "SELECT (SELECT arg_min(lai_suat, ky_han_ngay) FROM omo WHERE ngay = (SELECT max(ngay) FROM omo)\
        \ AND khoi_luong > 0)\n     - (SELECT cpi_yoy FROM cpi WHERE cpi_yoy IS NOT NULL ORDER BY thang DESC LIMIT\
        \ 1) AS lai_suat_thuc"
- name: doanh_so_qua_dem_so_tb20
  description: 'Doanh số qua đêm so với trung bình 20 phiên. Doanh số qua đêm phiên gần nhất chia trung bình 20
    phiên trước đó. Trên 1,3 lần = nhu cầu vốn ngắn hạn tăng vọt. Đơn vị: lần.'
  expression:
    dialects:
    - dialect: DUCKDB
      expression: "WITH x AS (SELECT ngay, doanh_so, AVG(doanh_so) OVER (ORDER BY ngay ROWS BETWEEN 20 PRECEDING\
        \ AND 1 PRECEDING) AS tb20\n           FROM lai_suat_lien_ngan_hang WHERE ky_han = 'ON')\nSELECT ngay, doanh_so\
        \ / tb20 AS ty_le FROM x ORDER BY ngay DESC LIMIT 1"
