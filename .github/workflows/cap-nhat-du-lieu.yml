name: Cập nhật số liệu

# Giữ bộ số liệu đóng gói sẵn trong bản cài (data/) luôn mới: mỗi đêm 23h15 giờ Việt Nam.
# App trên máy CFO tự cào tiếp; lượt này chỉ để người cài mới có ngay lịch sử đầy đủ.
on:
  schedule:
    - cron: "15 16 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Tải lại toàn bộ lịch sử NHNN (lâu, dễ bị chặn)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cap-nhat-du-lieu
  cancel-in-progress: false

jobs:
  cao:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Cào NHNN
        continue-on-error: true
        env:
          # Dùng phần gọi còn dư để lùi thêm lịch sử
          RADAR_BACKFILL: "1"
        run: python crawler/sbv.py ${{ inputs.full && '--full' || '' }}

      - name: Giá USD ngân hàng
        continue-on-error: true
        run: python crawler/ngan_hang.py

      - name: Kiểm số liệu trước khi đẩy
        run: python scripts/kiem_du_lieu.py

      - name: Commit nếu có số mới
        run: |
          git config user.name "cfo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Không có số mới"; exit 0; fi
          git commit -m "số liệu: cập nhật $(TZ=Asia/Ho_Chi_Minh date '+%d/%m/%Y %H:%M')"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1

